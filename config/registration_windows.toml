# USF Spring 2027 registration windows for the live schedule sync (PROJECT.md D-22, phase 09 D-02).
#
# Each window is a run of whole local days in `timezone`: it starts at local 00:00 of `start` and
# ends at local 00:00 of the day after `end`. Inside a window the worker sweeps about every
# 5 minutes; outside every window it sweeps about hourly.
#
# Sources were fetched on 2026-09-29. The USF Registrar marks these dates as "subject to change",
# so re-check both pages before 2026-11-02 and edit this file (no code change is needed).
term = "202701"
timezone = "America/New_York"

[[windows]]
label = "Priority registration by class standing (first group Nov 2, Non-Degree Nov 30)"
start = 2026-11-02
end = 2026-11-30
source = "https://www.usf.edu/registrar/register/registration_times.aspx"

[[windows]]
label = "Spring State employee registration (5 p.m.)"
start = 2027-01-07
end = 2027-01-07
source = "https://www.usf.edu/registrar/calendars/index.aspx"

[[windows]]
label = "Spring drop/add: classes begin Jan 11, drop/add ends Jan 15"
start = 2027-01-11
end = 2027-01-15
source = "https://www.usf.edu/registrar/calendars/index.aspx"
